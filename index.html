<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ready, set, send: revision</title>
<style>
:root{
  --black:#141414; --bar:#1d1d1d; --addr:#3b3b3b;
  --mid:#555; --grey:#7a7a7a; --line:#9a9a9a; --pale:#ececec; --pale2:#f5f5f5;
  --or:#F5A20F; --or-tint:#FFF0D2; --or-deep:#8A5300; --red:#9b2c2c; --red-tint:#F7E7E7;
  --disp:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Avant Garde","Futura","Trebuchet MS",sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
body{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.g0{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.g1{--pc:#141414;--pc-ink:#F5A20F;--pc-tint:#EFEFEF}
body.g2{--pc:#6B6B6B;--pc-ink:#ffffff;--pc-tint:#EBEBEB}
*{box-sizing:border-box}
html{font-size:28px;height:100%}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--body);color:var(--black);background:#fff;line-height:1.3;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--or);outline-offset:2px;box-shadow:0 0 0 7px var(--black)}
.disp{font-family:var(--disp);font-weight:700}

/* top bar */
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:.3rem;padding:.25rem .4rem;flex:none}
.dots{display:flex;gap:.2rem;flex:none}
.dots i{display:block;width:.36rem;height:.36rem;border-radius:50%;background:#9a9a9a}
.dots i:first-child{background:var(--or)}
.addr{flex:1;min-width:0;background:var(--addr);border-radius:999px;padding:.2rem .7rem;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:#fff;color:#111;border:0;border-radius:4px;font-weight:700;font-size:.75rem;min-height:44px;min-width:44px;padding:0 .4rem;flex:none}
.saved{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + min(5rem,150px));right:.5rem;background:var(--or);color:var(--black);font-weight:700;font-size:.7rem;padding:.1rem .6rem;border:2px solid var(--black);border-radius:999px;opacity:0;transition:opacity .3s;z-index:90;pointer-events:none}
.saved.on{opacity:1}
.prog{height:.4rem;background:#fff;flex:none;display:flex;gap:2px;padding:2px 2px 0}
.prog i{display:block;flex:1;height:100%;opacity:.25}
.prog i.on{opacity:1}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:.5rem .6rem 1.2rem;position:relative}
.wrap{max-width:900px;margin:0 auto;overflow-wrap:anywhere;word-break:normal}
.taskbox .tt,.taskbox .tf,.q,.opt .tx,.showtxt,.mist div,.lede{overflow-wrap:anywhere}

/* bottom bar */
.foot{flex:none;border-top:6px solid var(--pc);background:#fff;padding:.3rem .4rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.foot{font-size:min(.9rem,30px)}
.foot .bb{padding:.15em .4em}
.foot .bb{flex:1;white-space:nowrap}
.bb{border:3px solid var(--black);background:#fff;font-weight:700;min-height:2.1em;padding:.15em .7em;border-radius:4px;text-align:center}
.bb.go{background:var(--or);color:var(--black)}
.bb.solid{background:var(--black);color:#fff}
.bb.wait{background:#fff;border-style:dashed;border-color:var(--or-deep);color:var(--or-deep)}
.bb[disabled]{opacity:.35;cursor:default}
.foot .bb.menub{flex:0 0 auto}
.bb.skip{flex-basis:100%;background:var(--pale);font-weight:400}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + min(3.6rem,120px));font-size:min(.75rem,24px);white-space:nowrap;z-index:40;background:var(--black);color:#fff;border:3px solid var(--or);border-radius:999px;font-weight:700;padding:.2em .9em;min-height:44px;max-width:94vw;box-shadow:0 4px 0 rgba(0,0,0,.25)}

/* docx-look pieces */
.sbar{display:flex;align-items:stretch;margin:.2em 0 .5em}
.sbar .blk{background:var(--pc);color:var(--pc-ink);font-family:var(--disp);font-weight:700;min-width:1.9em;display:flex;align-items:center;justify-content:center;font-size:1.1em;padding:0 .25em}
.sbar .ttl{flex:1;background:var(--pc-tint);border:3px solid var(--black);border-left:0;padding:.25em .6em;font-family:var(--disp);font-weight:700}
.lede{color:var(--mid);margin:.1em 0 .5em}
.live{border:3px solid var(--black);background:var(--pale2);padding:.3em .6em;margin:.4em 0 .6em}
.live.small{font-size:.72em;padding:.2em .5em;margin:.2em 0 .4em}
.live .bar{height:.4em;background:#fff;border:2px solid var(--black);margin-top:.3em}
.live .bar i{display:block;height:100%;background:var(--or)}
.note{display:flex;background:var(--pale2);margin:.6em 0}
.note .badge{width:1.7em;flex:none;background:#555;color:#fff;display:flex;justify-content:center;padding-top:.3em;font-weight:700}
.note.ok .badge{background:var(--black);color:var(--or)}
.note.warn .badge{background:var(--red)}
.note .nb{padding:.4em .7em;flex:1;min-width:0}
.note p{margin:.15em 0}
.hl{background:var(--or-tint);border-bottom:3px solid var(--or);padding:0 .15em;font-weight:700}
.muted{color:var(--mid)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.grouphead{font-family:var(--disp);font-weight:700;margin:1em 0 .4em;display:flex;align-items:center;gap:.4em}
.grouphead .sw{width:1em;height:1em;border:3px solid var(--black);flex:none}

/* menu tiles */
.hero{border:3px solid var(--black);border-bottom:10px solid var(--or);margin:.3em 0 .6em}
.hero .hbar{background:var(--bar);color:#fff;padding:.25em .6em;font-size:.75em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .panel{background:var(--or-tint);border-left:12px solid var(--or);margin:.6em;padding:.6em .8em}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:.75em}
.big{font-family:var(--disp);font-weight:700;font-size:1.6em;line-height:1.1;margin:.15em 0}
.mtile{display:flex;align-items:stretch;width:100%;text-align:left;border:3px solid var(--black);border-bottom-width:7px;background:#fff;padding:0;margin:.4em 0}
.mtile .l{font-family:var(--disp);font-weight:700;width:1.9em;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.mtile .t{padding:.35em .6em;flex:1;min-width:0}
.mtile .t b{display:block}
.mtile .d{display:block;color:var(--mid)}
.mtile .sc{display:inline-block;margin-top:.25em;border:2px solid var(--black);border-radius:999px;padding:0 .5em;font-weight:700}
.mtile .sc.done{background:var(--or)}
.welcome{border:3px solid var(--black);background:var(--or);padding:.5em .7em;margin:.5em 0}

/* item cards */
.card{border:3px solid var(--black);border-bottom:8px solid var(--pc);background:#fff;padding:.6em .7em;margin:.7em 0;border-left-width:3px}
.card.ok{border-left:12px solid var(--or)}
.card.no{border-left:12px solid var(--red)}
.card.flash{animation:flash 1s}
@keyframes flash{25%{background:var(--or-tint)}75%{background:var(--or-tint)}}
.chead{display:flex;align-items:center;gap:.4em;margin-bottom:.3em;flex-wrap:wrap}
.num{background:var(--pc);color:var(--pc-ink);font-weight:700;min-width:1.6em;min-height:1.6em;display:flex;align-items:center;justify-content:center}
.tag{border:2px solid var(--tagc,#8A5300);color:var(--tagc,#8A5300);padding:0 .45em;font-weight:700;font-size:.85em;border-radius:3px}
.q{font-weight:700;margin:.3em 0 .55em;background:var(--pc-tint);border-left:8px solid var(--pc);padding:.45em .6em}
.stress{background:var(--pc-tint);border-left:8px solid var(--pc);padding:.2em .4em}
.showtxt{border:3px solid var(--black);background:var(--pale2);padding:.4em .6em;margin:.3em 0 .5em;font-family:var(--mono);white-space:pre-line;overflow-wrap:anywhere}
.opt{display:flex;gap:.5em;align-items:center;width:100%;text-align:left;border:3px solid var(--black);background:#fff;min-height:2.1em;padding:.3em .6em;margin:.35em 0;border-radius:4px}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt .ol{flex:none;min-width:1.5em;height:1.5em;display:inline-flex;align-items:center;justify-content:center;background:var(--pc-tint);border:2px solid var(--pc);color:var(--black);font-weight:700;border-radius:4px}
.opt.right .ol{background:var(--or);border-color:var(--or)}
.opt{padding-left:.4em}
.opt .mk{margin-left:auto;font-weight:700;flex:none}
.q,.fb,.mist div{overflow-wrap:anywhere}
.opt.right{background:var(--black);color:#fff}
.opt.right .mk{color:var(--or)}
.opt.wrong{background:repeating-linear-gradient(45deg,#e8e8e8 0 8px,#cdcdcd 8px 16px)}
.opt.wrong .tx{text-decoration:line-through}
.opt.dim{opacity:.45}
.fb{margin:.4em 0 .2em;padding:.4em .6em;border:3px solid var(--black);background:var(--pale2)}
.fb.good{background:var(--or-tint)}
.fb b{display:block}
.chg{border:2px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .8em;font-weight:700;margin-top:.3em}
.say{border:2px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .8em;font-weight:700}
.stress{font-family:var(--disp);font-weight:700;font-size:min(1.5em,10vw);text-align:center;margin:.2em 0}
.summary{border:3px solid var(--black);border-bottom:8px solid var(--pc);background:var(--pc-tint);padding:.6em .7em;margin:1em 0}
.mchip{border:2px solid var(--black);background:#fff;border-radius:999px;min-height:44px;padding:0 .7em;margin:.15em;font-weight:700}

/* ===== simulation ===== */
.taskbox{position:sticky;top:-.5rem;z-index:20;background:#fff;border:3px solid var(--black);border-bottom:8px solid var(--or);padding:.4em .6em;margin:.3em 0 .5em;box-shadow:0 6px 0 #fff}
.taskbox{font-size:.9em;background:var(--pc-tint);border-color:var(--black)}
.taskbox .tt::before{content:"\1F449  "}
.taskbox .tf{background:#fff}
@media (max-height:900px), (max-width:600px){ .taskbox{position:static;box-shadow:none} }
.taskbox .tn{font-size:.8em;color:var(--mid);font-weight:700}
.taskbox .tt{font-weight:700;font-size:1.05em}
.taskbox .tf{font-size:.85em;margin-bottom:.25em;padding:.2em .4em}
.taskbox .tf.good{background:var(--or-tint);border-left:6px solid var(--or)}
.taskbox .tf.bad{background:var(--red-tint);border-left:6px solid var(--red)}
.sim{font-size:.62em;border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;overflow:hidden;line-height:1.25;user-select:none;-webkit-user-select:none}
.hit{font:inherit;color:inherit;min-height:44px;min-width:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:.2em .5em;border-radius:6px;text-align:left;-webkit-tap-highlight-color:transparent}
.sim .hit{scroll-margin-top:9rem;scroll-margin-bottom:2rem}
.hit.okf{animation:okf .7s}
.hit.nof{animation:nof .6s}
@keyframes okf{0%,60%{background:var(--or);color:var(--black);box-shadow:0 0 0 3px var(--black)}}
@keyframes nof{0%,20%,60%{transform:translateX(-4px);background:#d3d3d3}40%,80%{transform:translateX(4px)}}
.hit.done{box-shadow:inset 0 0 0 3px var(--or)}

/* desktop */
.desk{color:#fff;background:#2c3a4d}
.wall{background:radial-gradient(ellipse at 75% 20%,#5d7690 0%,#3b4d63 45%,#25303e 100%);padding:.8em .5em 1.2em;min-height:22em}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6em,1fr));gap:.9em .2em}
.icons .hit{flex-direction:column;justify-content:flex-start;padding:.35em .2em;color:#fff;border-radius:10px}
.icons .hit:active{background:rgba(255,255,255,.18)}
.icons .hit.done{background:rgba(245,162,15,.22);box-shadow:inset 0 0 0 3px var(--or)}
.ic{width:4.6em;height:4.6em;border-radius:20%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.45)}
.ic svg{width:76%;height:76%}
.icl{font-size:1.05em;font-weight:700;margin-top:.35em;text-align:center;min-height:1.3em;color:#fff;text-shadow:0 1px 3px #000}
.taskbar{display:flex;align-items:center;gap:.6em;background:rgba(20,24,32,.96);padding:.35em .6em;color:#e6e9f2;border-top:1px solid #4a5568}
.startb{display:inline-flex;width:2.2em;height:2.2em;align-items:center;justify-content:center;background:#3b4658;border-radius:6px}
.startb svg{width:1.2em;height:1.2em}
.tsearch{flex:1;background:#3b4658;border-radius:999px;padding:.35em .8em;color:#c9cede;white-space:nowrap;overflow:hidden}
.clock{display:flex;flex-direction:column;align-items:flex-end;font-size:.85em;line-height:1.15;white-space:nowrap}
/* browser chrome */
.chrome{background:#e4e6eb}
.tabs{display:flex;align-items:flex-end;gap:.2em;padding:.35em .35em 0;min-width:0}
.tabw{display:flex;align-items:center;background:#d2d6de;border-radius:8px 8px 0 0;min-width:0;flex:0 1 auto}
.tabw.on{background:#fff}
.tabw .hit.tabt{justify-content:flex-start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:11em;display:block;line-height:44px;padding:0 .4em}
.tabw .hit.tabx{min-width:40px;padding:0}
.tool{display:flex;align-items:center;gap:.1em;padding:.15em .25em .25em;background:#fff;border-bottom:2px solid #d6d9e0}
.tool .hit{padding:0 .3em;font-size:1.15em}
.tool .hit.addr{flex:1;min-width:0;justify-content:flex-start;background:#eef0f4;border-radius:999px;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px;padding:0 .7em}
.tool .fwd{color:#9aa0ab}
.page{display:flex;min-height:15em;position:relative}
.pcont{flex:1;min-width:0}
.scol{width:30px;flex:none;background:#f1f2f5;border-left:2px solid #dcdfe5;display:flex}
.scol .hit{width:100%;min-width:30px;padding:0;align-items:flex-start;border-radius:0}
.thumb{display:block;width:12px;height:3.5em;background:#8d929c;border-radius:6px;margin:.4em auto 0}
.thumb.low{margin-top:6em}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3em;padding:.4em .5em}
.logo{font-family:var(--disp);font-weight:700;font-size:1.25em}
.logo i{display:inline-flex;width:1.5em;height:1.5em;border-radius:50%;background:#3a3a3a;color:#fff;font-style:normal;align-items:center;justify-content:center;margin-right:.25em;font-size:.9em}
.sbox{border:2px solid #b9bdc6;border-radius:999px;color:#666;background:#fff;padding:0 .7em}
.nav{background:#1b1b1b;display:flex;flex-wrap:wrap;padding:0 .2em}
.nav .hit{color:#fff;font-family:var(--disp);font-weight:700;padding:0 .5em}
.herop{background:#e6e6e6;padding:.7em .7em .8em;position:relative}
.herop h3{margin:0 0 .2em;font-family:var(--disp);font-size:1.35em}
.findbtn{background:#3d3d3d!important;color:#fff!important;border-radius:999px!important;font-family:var(--disp);font-weight:700;padding:0 1em!important;margin-top:.4em}
.cursor{position:absolute;right:16%;top:1.6em;font-size:1.6em;min-width:44px;min-height:44px}
.cards{display:flex;flex-wrap:wrap;gap:.4em;padding:.6em}
.cards .hit{border:2px solid #d0d3da;border-radius:6px;flex:1 1 8em;flex-direction:column;align-items:flex-start;padding:.4em .5em}
.cards b{font-family:var(--disp)}
.drop{margin:0 .6em .2em 3.5em;border:2px solid #d0d3da;background:#fff;display:flex;flex-direction:column;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.drop .hit{justify-content:space-between;border-radius:0;border-bottom:1px solid #eee;width:100%}
.drop .hit.open{background:#e9e9e9}
.drop.two{margin-left:5.5em}
.pbody{padding:.6em .7em}
.pbody h3{font-family:var(--disp);margin:.1em 0 .4em;font-size:1.3em}
.pbody p{margin:.3em 0}
.fade{color:#aaa}
.blank{padding:2.5em 1em;text-align:center;color:var(--mid)}
.keys{display:flex;flex-wrap:wrap;gap:.35em;padding:.6em;background:#d9dce2}
.keys .hit{background:#fff;border:2px solid #9aa0ab;border-radius:6px;font-family:var(--mono);font-weight:700;font-size:1.15em;padding:0 .6em;box-shadow:0 3px 0 #9aa0ab}
.keys .hit.enter{background:var(--black);color:#fff;font-family:var(--body)}
.serp{padding:.4em .7em}
.serp .slogo{font-family:var(--disp);font-weight:700;font-size:1.3em;margin-right:.4em}
.stabs{display:flex;flex-wrap:wrap;border-bottom:2px solid #dcdfe5;padding:0 .4em}
.stabs .hit{color:#555;font-family:var(--disp);font-weight:700}
.stabs .hit.cur{color:#111;box-shadow:inset 0 -4px 0 #111;border-radius:0}
.res{padding:.35em .5em .5em}
.res .hit{display:flex;justify-content:flex-start;padding:0 .3em;min-height:40px}
.res .rurl{color:#5b6070}
.res .rt{font-family:var(--disp);font-weight:700;font-size:1.1em;color:#1a4fb5;text-decoration:underline;text-decoration-thickness:1px}
.res .rd{padding:0 .3em;color:#333}
.spons{font-weight:700;color:#111}
.loading{padding:3em 1em;text-align:center;font-weight:700}

.th{display:inline-flex;width:1.7em;height:1.7em;background:#111;color:#fff;border-radius:6px;align-items:center;justify-content:center;font-style:normal;font-size:.85em;margin-right:.3em;font-family:var(--disp)}
.logo .th{border-radius:6px}
.pillb{border:2px solid #333!important;border-radius:999px!important;padding:0 1em!important;font-weight:700;background:#fff}
.pillb.dark{background:#3d3d3d!important;color:#fff!important}
.thhero{display:flex!important;flex-direction:column;align-items:flex-start!important;background:#1b1b1b!important;color:#fff!important;width:100%;border-radius:0!important;padding:.7em .8em!important}
.thhero h3{margin:0 0 .2em;font-family:var(--disp);font-size:1.35em}
.lvls{display:flex;flex-wrap:wrap;gap:.4em}
.lvl{flex:1 1 9em;flex-direction:column;align-items:flex-start!important;background:#f1f2f5!important;border-radius:8px!important;padding:.5em .6em!important}
.lvl b{font-family:var(--disp);font-size:1.15em}
.lvl .start{font-weight:700;margin-top:.2em}
.flinks{display:flex;flex-wrap:wrap;padding:0 .4em .5em;color:#555}
.l2tabs{display:flex;flex-wrap:wrap;gap:.3em;padding:.2em .5em .5em}
.l2tabs .hit{background:#eef0f4;border-radius:999px;font-family:var(--disp);font-weight:700;padding:0 .9em}
.l2tabs .hit.on{background:#444;color:#fff}
.lrows{padding:0 .5em .6em}
.lrow{display:flex;flex-wrap:wrap;align-items:center;border:2px solid #d0d3da;border-radius:8px;margin:.3em 0;padding:0 .2em}
.lrow .ltitle{flex:1 1 10em;justify-content:flex-start;font-family:var(--disp);font-weight:700}
.newb{background:#111!important;color:#fff!important;border-radius:999px!important;font-weight:700;min-height:44px!important}
.ltime{color:#555}
.player,.lplayer{background:#1b1b1b;color:#fff;border-radius:10px;padding:.6em .7em}
.lplayer{border:3px solid var(--black);margin:.4em 0 .6em}
.lplayer .say{background:#fff;color:#111}
.lplayer .mchip{min-width:44px;color:#111;background:#fff}
.lplayer .muted{color:#d5d9e3}
.lsteps{color:#c9cede;margin:.2em 0 .4em}
.ptitle{font-family:var(--disp);font-weight:700;font-size:1.15em}
.psub{color:#c9cede;margin-bottom:.3em}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:.2em}
.ctrls .hit{color:#fff;font-size:1.2em}
.ctrls .playb{background:#fff!important;color:#111!important;border-radius:50%!important;width:2.4em;height:2.4em}
.ctrls .dim{opacity:.5}
.ctrls .spd{border:2px solid #fff!important;border-radius:999px!important;font-size:1em}
.pbar{width:100%;justify-content:flex-start!important;padding:0 .3em!important}
.pbar .pfill{display:block;height:8px;background:#fff;border-radius:4px;box-shadow:inset 0 0 0 0 #fff}
.pbar::after{content:"";flex:1;height:8px;background:#4b5263;border-radius:4px}
.showt{background:#3a4152!important;color:#fff!important;border-radius:999px!important;font-weight:700;margin-top:.3em}
.ptext{background:#fff;color:#111;border-radius:6px;padding:.4em .6em;margin-top:.4em}

    {t:"Start a new line after See you later,", target:"enter", rl:"Enter", why:"Enter starts a new line. Your name goes on the next line."},
    {t:"Make a space between two words.", target:"space", rl:"the space bar", why:"The space bar makes a space. No spaces in an email address."},

    {t:"Type the first letter of Ms Tran's address: t", target:"kt", rl:"the t key", why:"tran_k starts with t. No capital letter."}]},

  {id:"G", grp:1, title:"New expressions", desc:"George and Hideko's expressions. What do they mean?", type:"q", shuffleQ:true, items:[
    {tag:"Expression", q:"\"My bad.\" What does it mean?", opts:["It's my mistake. Sorry.", "I feel sick today.", "That's a bad email."], why:"My bad = my mistake. It's informal."},
    {tag:"Expression", q:"\"Bummer.\" What does it mean?", opts:["That's bad luck.", "That's a good idea.", "Please wait a minute."], why:"Bummer = bad luck. We say it when something goes wrong."},
    {tag:"Expression", q:"\"It is what it is.\" What does it mean?", opts:["That's how it is. We can't change it.", "What is it? I can't see it on the screen.", "It's a new thing. Let's try it today."], why:"It is what it is = we can't change it, so we accept it."},
    {tag:"Expression", q:"\"It's an easy fix.\" What does it mean?", opts:["It's simple to make it right.", "It's very hard to make it right.", "The computer is broken now."], why:"An easy fix = a simple way to make it right."},
    {tag:"Expression", q:"\"Happy days!\" What does it mean?", opts:["Great! I'm really happy about that.", "Have a good holiday next week.", "Every day is the same for me."], why:"Happy days! = Great! I'm happy."},
    {tag:"Expression", q:"\"Sweet as.\" What does it mean?", opts:["Great. That's fine.", "It's very sugary.", "I'm not sure."], why:"Sweet as = great, fine. It's very Australian."},
    {tag:"Expression", q:"\"Catch you later.\" What does it mean?", opts:["Goodbye. See you soon.", "Wait for me here.", "Throw me the ball."], why:"Catch you later = goodbye, see you soon."},
    {tag:"Expression", q:"\"Talk soon.\" What does it mean?", opts:["We'll talk or write again soon.", "Please talk more slowly to me.", "Don't talk now. Be quiet."], why:"Talk soon is a friendly closing."},
    {tag:"Use it", show:"George sees his mistake in the address.", q:"What does George say?", opts:["My bad.", "Happy days!", "Talk soon."], why:"My bad = my mistake."},
    {tag:"Use it", show:"The email arrived! George is really happy.", q:"What does George say?", opts:["Happy days!", "Bummer.", "My bad."], why:"Happy days! = I'm really happy."},
    {tag:"To your teacher", q:"Which closing is good in an email to your teacher?", opts:["Talk soon,", "Bummer,", "My bad,"], why:"Talk soon, is friendly and polite. Keep My bad and Bummer for friends."}]},
  {id:"H", grp:1, title:"Say what's wrong, then ask", desc:"Three steps: the problem, what you did, a clear question.", type:"q", shuffleQ:true, intro:"strategy", items:[
    {tag:"Step 1", show:"Your email isn't in Sent Items.", q:"Which sentence says the problem?", opts:["My email isn't in Sent Items.", "I sent my email to Ms Tran.", "Can you help me, please?"], why:"Step 1: say the problem."},
    {tag:"Step 2", show:"Your email didn't arrive.", q:"Which sentence says what you did?", opts:["I clicked Send last night.", "My email didn't arrive.", "Where is Sent Items?"], why:"Step 2: say what you did. Use the past simple."},
    {tag:"Step 3", show:"You think the address is wrong.", q:"Which one is a clear question?", opts:["Can you check the address?", "My email didn't arrive today.", "I typed Ms Tran's address."], why:"Step 3: ask a clear question."},
    {tag:"All three", q:"Which is the best way to ask for help?", opts:["Ms Tran didn't get my email. I sent it last night. Can you help me?", "Help! My email! It's not working! Ms Tran! Last night! Now!", "I sent an email last night. Can I have your password, please?"], why:"The problem, what you did, a clear question."},
    {tag:"Ask", show:"You can't find Send.", q:"What do you ask?", opts:["Where is Send on this screen?", "Can you write my email for me?", "Why is this screen so small?"], why:"A clear question about the problem."},
    {tag:"Say it back", show:"Hideko: Click on your initials. Then click Sign out.", q:"You are not sure. What do you say?", opts:["So I click on GW, then Sign out?", "OK. I'll send it again now.", "My bad. I forgot my password."], why:"Say the steps back to check."},
    {tag:"Safe", show:"A classmate says: Give me your password. I'll fix it.", q:"What do you do?", opts:["Say no. Ask your teacher for help.", "Say yes. Write it on the board.", "Send it to them in an email."], why:"Never give your password to anyone."},
    {tag:"Answer", show:"Your teacher: What's wrong?", q:"What do you say?", opts:["I forgot my password. What do I do?", "I'm fine, thanks. And you?", "Yes, I like this email program."], why:"Say the problem, then ask."}]},
  {id:"I", grp:1, title:"Where is the strong part?", desc:"Tap Hear it. Which part is strong?", type:"q", shuffleQ:true, intro:"stress", items:[
    {k:"fixed", tag:"Strong part", sayw:"inbox", q:"inbox", opts:["IN·box", "in·BOX"], ans:0, why:"IN·box"},
    {k:"fixed", tag:"Strong part", sayw:"subject", q:"subject", opts:["SUB·ject", "sub·JECT"], ans:0, why:"SUB·ject: the subject of an email."},
    {k:"fixed", tag:"Strong part", sayw:"reply", q:"reply", opts:["RE·ply", "re·PLY"], ans:1, why:"re·PLY"},
    {k:"fixed", tag:"Strong part", sayw:"delete", q:"delete", opts:["DE·lete", "de·LETE"], ans:1, why:"de·LETE"},
    {k:"fixed", tag:"Strong part", sayw:"forward", q:"forward", opts:["FOR·ward", "for·WARD"], ans:0, why:"FOR·ward"},
    {k:"fixed", tag:"Strong part", sayw:"password", q:"password", opts:["PASS·word", "pass·WORD"], ans:0, why:"PASS·word"},
    {k:"fixed", tag:"Strong part", sayw:"attach", q:"attach", opts:["AT·tach", "at·TACH"], ans:1, why:"at·TACH"},
    {k:"fixed", tag:"Strong part", sayw:"message", q:"message", opts:["MES·sage", "mes·SAGE"], ans:0, why:"MES·sage"},
    {k:"fixed", tag:"Strong part", sayw:"keyboard", q:"keyboard", opts:["KEY·board", "key·BOARD"], ans:0, why:"KEY·board"},
    {k:"fixed", tag:"Strong part", sayw:"discard", q:"discard", opts:["DIS·card", "dis·CARD"], ans:1, why:"dis·CARD"},
    {k:"fixed", tag:"Two-word verb", sayw:"sign out", q:"sign out", opts:["SIGN out", "sign OUT"], ans:1, why:"Two-word verbs: the second word is strong. sign OUT."},
    {k:"fixed", tag:"Two-word verb", sayw:"log in", q:"log in", opts:["LOG in", "log IN"], ans:1, why:"Two-word verbs: the second word is strong. log IN."}]},
  {id:"J", grp:1, title:"Say the keys", desc:"You hear the keys. What do you type?", type:"q", shuffleQ:true, intro:"keys", items:[
    {tag:"You hear", hear:"x, i, a, Shift and dash, w, Shift and 2, gmail, full stop, com", show:"You hear: x, i, a, Shift and dash, w, Shift and 2, gmail, full stop, com", q:"What do you type?", opts:["xia_w@gmail.com", "xia-w@gmail.com", "xiaw@gmail.com"], why:"Shift and dash = _. Shift and 2 = @."},
    {tag:"You hear", hear:"Shift and h, i, space bar, Shift and j, a, n, e, comma", show:"You hear: Shift and h, i, space bar, Shift and j, a, n, e, comma", q:"What do you type?", opts:["Hi Jane,", "hi Jane,", "Hi jane,"], why:"Shift makes a capital: H and J."},
    {tag:"You hear", hear:"a, l, a, n, full stop, k, Shift and 2, gmail, full stop, com", show:"You hear: a, l, a, n, full stop, k, Shift and 2, gmail, full stop, com", q:"What do you type?", opts:["alan.k@gmail.com", "alan_k@gmail.com", "alan.k2@gmail.com"], why:"full stop = . (dot). Shift and 2 = @."},
    {tag:"You hear", hear:"j, i, a, o, Shift and dash, l, Shift and 2, outlook, full stop, com", show:"You hear: j, i, a, o, Shift and dash, l, Shift and 2, outlook, full stop, com", q:"What do you type?", opts:["jiao_l@outlook.com", "jiao-l@outlook.com", "jiao_l@outlookcom"], why:"Shift and dash = _. Don't forget the dot before com."},
    {tag:"You hear", show:"You hear: Talk soon, comma, Enter, Shift and c, o, c, o", q:"What do you see?", opts:["Talk soon, (Coco on the next line)", "Talk soon, Coco (on one line)", "Talk soon (Coco on the next line)"], why:"Enter starts a new line. The name goes on the next line."},
    {tag:"Caps Lock", show:"Caps Lock is on. You type n, a, m.", q:"What do you see?", opts:["NAM", "Nam", "nam"], why:"Caps Lock makes ALL CAPITALS. Press it again to turn it off."},
    {tag:"Fix it", show:"You typed tran_kk. You want tran_k.", q:"Which key do you press one time?", opts:["Backspace", "Enter", "Shift"], why:"Backspace deletes the letter on the left."},
    {tag:"Tell a classmate", q:"How do you make @? Tell a classmate.", opts:["Hold down Shift and press 2.", "Hold down Caps Lock and press 2.", "Press the full stop key two times."], why:"Shift and 2 = @."}]},
  {id:"K", grp:1, title:"Compound sentences in the past", desc:"Join two ideas with and, but or because. Use the past simple.", type:"q", shuffleQ:true, intro:"compound", items:[
    {tag:"Past simple", q:"We ___ the train and it was quick.", opts:["took", "take", "taked"], why:"take → took."},
    {tag:"Joining word", q:"I loved the class ___ the teacher was kind.", opts:["because", "but", "or"], why:"because gives the reason."},
    {tag:"Joining word", q:"The park was beautiful, ___ it was very cold.", opts:["but", "because", "or"], why:"but shows a difference: beautiful, but cold."},
    {tag:"Join it", show:"Linda went to the market. Linda bought some fruit.", q:"Join the two sentences.", opts:["Linda went to the market and bought some fruit.", "Linda went to the market because bought some fruit.", "Linda went to the market, but Linda buy some fruit."], why:"Same person: you can drop the second Linda."},
    {tag:"Comma", q:"Which one is right?", opts:["I liked the café because the staff were friendly.", "I liked the café, because the staff were friendly.", "I liked the café. Because the staff were friendly."], why:"No comma before because."},
    {tag:"Past simple", q:"Last week Nam ___ a quiet room at the library.", opts:["found", "finded", "find"], why:"find → found."},
    {tag:"Which one?", q:"Which is a compound sentence in the past?", opts:["We walked there and we had lunch.", "We walk there every Sunday morning.", "We will walk there next Sunday."], why:"Two ideas, joined with and, in the past simple."},
    {tag:"Fix it", show:"Yesterday Jason go to the library and he borrowed a book.", q:"Choose the correct sentence.", opts:["Yesterday Jason went to the library and he borrowed a book.", "Yesterday Jason go to the library and he borrow a book.", "Yesterday Jason goes to the library and he borrowed a book."], why:"Yesterday = past simple: went."},
    {tag:"Past simple", q:"The bus ___ late, but we got there on time.", opts:["was", "is", "were"], why:"The bus = it. Past: was."},
    {tag:"Question", q:"Did you ___ Sent Items?", opts:["check", "checked", "checking"], why:"Did you + verb. No -ed."}]},
  {id:"L", grp:1, title:"How, when, where?", desc:"Adverbs and phrases tell the reader more.", type:"q", shuffleQ:true, intro:"hww", items:[
    {k:"fixed", tag:"How, when or where?", q:"by train", opts:HWW, ans:0, why:"by train tells us how."},
    {k:"fixed", tag:"How, when or where?", q:"every Thursday", opts:HWW, ans:1, why:"every Thursday tells us when."},
    {k:"fixed", tag:"How, when or where?", q:"near the station", opts:HWW, ans:2, why:"near the station tells us where."},
    {k:"fixed", tag:"How, when or where?", q:"quickly", opts:HWW, ans:0, why:"quickly tells us how."},
    {k:"fixed", tag:"How, when or where?", q:"after class", opts:HWW, ans:1, why:"after class tells us when."},
    {k:"fixed", tag:"How, when or where?", q:"opposite the park", opts:HWW, ans:2, why:"opposite the park tells us where."},
    {tag:"on, at, in", q:"We can meet ___ Saturday.", opts:["on", "at", "in"], why:"on + a day."},
    {tag:"on, at, in", q:"The room opens ___ 10 am.", opts:["at", "on", "in"], why:"at + a time."},
    {tag:"on, at, in", q:"It's quiet there ___ the afternoon.", opts:["in", "on", "at"], why:"in + part of the day."},
    {tag:"on, at, in", q:"The bus comes ___ five minutes.", opts:["in", "at", "on"], why:"in + how long until."},
    {tag:"on, at, in", q:"The club meets ___ lunchtime.", opts:["at", "in", "on"], why:"at lunchtime."},
    {tag:"on, at, in", q:"The library is closed ___ the weekend.", opts:["on", "in", "at"], why:"on the weekend."},
    {tag:"Where does it go?", q:"Which one is right?", opts:["We can get there easily by bus.", "We can easily by bus get there.", "Easily by bus we can there get."], why:"How and when phrases usually go at the end."}]},
  {id:"M", grp:1, title:"Ask the question", desc:"Here is the answer. Choose the question.", type:"q", shuffleQ:true, items:[
    {tag:"Question", show:"Answer: It takes about fifteen minutes by train.", q:"What is the question?", opts:["How long does it take?", "How much does it take?", "How many does it take?"], why:"How long ...? asks about time."},
    {tag:"Question", show:"Answer: It opens at 8:30 am.", q:"What is the question?", opts:["What time does it open?", "What time it opens?", "What time does it opens?"], why:"What time does it + verb (no -s)?"},
    {tag:"Question", show:"Answer: We can meet on Tuesday.", q:"What is the question?", opts:["When can we meet?", "When we can meet?", "When can we meeting?"], why:"When + can + we + verb?"},
    {tag:"Question", show:"Answer: It costs five dollars.", q:"What is the question?", opts:["How much does it cost?", "How many does it cost?", "How much it costs?"], why:"How much ...? asks about a price."},
    {tag:"Question", show:"Answer: We can get there on foot.", q:"What is the question?", opts:["How can we get there?", "How we can get there?", "Where can we get there?"], why:"How ...? asks about the way."},
    {tag:"Question", show:"Answer: It's opposite the post office.", q:"What is the question?", opts:["Where is it?", "Where it is?", "When is it?"], why:"Where is it? Put is before it."},
    {tag:"Question", show:"Answer: Yes, it's free for students.", q:"What is the question?", opts:["Is it free for students?", "It is free for students?", "Does it free for students?"], why:"A yes / no question: Is it ...?"},
    {tag:"Question", show:"Answer: It closes at 5 pm on Saturdays.", q:"What is the question?", opts:["What time does it close on Saturdays?", "What time it closes on Saturdays?", "How long does it close on Saturdays?"], why:"What time does it + verb (no -s)?"}]},
  {id:"N", grp:1, title:"Read it: Yuko's email", desc:"Read Yuko's idea and Ms Tran's reply. Answer the questions.", type:"q", shuffleQ:true, intro:"yuko", items:[
    {tag:"Read", q:"Who is Yuko writing to?", opts:["Ms Tran, her teacher", "Hideko, a classmate", "the community centre"], why:"To: tran_k@harbourmail.com.au. Hi Ms Tran."},
    {tag:"Read", q:"Where is the Banksia Room?", opts:["at the community centre in Chatswood", "at the library in Lane Cove", "next to the college in Crows Nest"], why:"a meeting room at the community centre in Chatswood."},
    {tag:"Read", q:"How can the class get there?", opts:["by train, then a short walk", "by bus, then a short ferry", "by car, then a long walk"], why:"by train. The station is a short walk from the centre."},
    {tag:"Read", q:"When did Yuko go there?", opts:["last week", "last month", "yesterday"], why:"I went there last week."},
    {tag:"Read", q:"Why is it a good place for the club?", opts:["It's quiet in the morning.", "It's open late every night.", "It's next to the beach."], why:"... because it's quiet in the morning."},
    {tag:"Language", q:"Which sentence is a compound sentence in the past?", opts:["I went there last week and I liked it.", "It has big windows and a lot of chairs.", "Can we meet there on Tuesday mornings?"], why:"Two ideas, in the past, joined with and."},
    {tag:"Language", q:"Find the phrase for how.", opts:["by train", "last week", "in Chatswood"], why:"by train tells us how. last week = when. in Chatswood = where."},
    {tag:"The reply", q:"Ms Tran's reply has a comment and a question. Which part is the comment?", opts:["Big windows sound lovely!", "What time does the room open?", "Cheers, Ms Tran"], why:"A comment says what Ms Tran thinks."},
    {tag:"The reply", q:"Which reply from Yuko is best?", opts:["Thanks! It opens at 9 am.", "Thanks! It's a really nice room.", "Dear Ms Tran, I wish to inform you."], why:"Say thanks. Answer the question."}]},
  {id:"O", grp:1, title:"Fix it with the code", desc:"Each line has one mistake. Choose the correct line.", type:"q", shuffleQ:true, intro:"code", items:[
    {tag:"C", show:"my idea is the park in Lane Cove.   (C)", q:"Choose the correct line.", opts:["My idea is the park in Lane Cove.", "my Idea is the park in Lane Cove.", "My idea is the Park in lane cove."], why:"C = capital letter. Start with a capital: My."},
    {tag:"A", show:"It has a big kitchen and a outdoor area.   (A)", q:"Choose the correct line.", opts:["It has a big kitchen and an outdoor area.", "It has a big kitchen and the a outdoor area.", "It has big kitchen and a outdoors area."], why:"A = article. an before a vowel sound: an outdoor area."},
    {tag:"SV", show:"The room have free tea and coffee.   (SV)", q:"Choose the correct line.", opts:["The room has free tea and coffee.", "The room having free tea and coffee.", "The rooms has free tea and coffee."], why:"SV = subject and verb. The room = it: has."},
    {tag:"WT", show:"Last week I visit the centre.   (WT)", q:"Choose the correct line.", opts:["Last week I visited the centre.", "Last week I will visit the centre.", "Last week I am visiting the centre."], why:"WT = wrong tense. Last week = past simple: visited."},
    {tag:"WF", show:"We can get there quick by train.   (WF)", q:"Choose the correct line.", opts:["We can get there quickly by train.", "We can get there quickest by train.", "We can quick get there by train."], why:"WF = wrong form. An action needs an adverb: quickly."},
    {tag:"P", show:"Can we meet on Tuesday   (P)", q:"Choose the correct line.", opts:["Can we meet on Tuesday?", "Can we meet on Tuesday.", "Can we meet, on Tuesday"], why:"P = punctuation. A question ends with ?"},
    {tag:"Sp", show:"The centre is near the libary.   (Sp)", q:"Choose the correct line.", opts:["The centre is near the library.", "The centre is near the libery.", "The centre is near the librery."], why:"Sp = spelling: library."},
    {tag:"MW", show:"It's a good place ⌃ our club.   (MW)", q:"Choose the correct line.", opts:["It's a good place for our club.", "It's a good place to our club.", "It's a good place our club for."], why:"MW = missing word: a good place for our club."}]},
  {id:"P", grp:1, title:"Problems and fixes", desc:"Something goes wrong. What do you do?", type:"q", shuffleQ:true, items:[
    {tag:"Problem", show:"Your email is in Drafts. It isn't in Sent Items.", q:"What do you do?", opts:["Open Drafts, open the email and click Send.", "Sign out now and close the browser quickly.", "Write the same email again in Junk Email."], why:"It didn't go. Open it in Drafts and click Send."},
    {tag:"Problem", show:"You get an email: Undeliverable.", q:"What do you do?", opts:["Check the address. Fix it and send it again.", "Delete it. Your email arrived on time.", "Click Reply all and say thanks to everyone."], why:"Undeliverable = it didn't arrive. Check the address."},
    {tag:"Problem", show:"You typed the subject in the To box.", q:"What do you do?", opts:["Delete it. Type it in Add a subject.", "Click Send. Ms Tran can still read it.", "Click Bcc and type the subject again."], why:"The subject goes in Add a subject."},
    {tag:"Problem", show:"You clicked Reply all. Only Ms Tran needs your answer.", q:"What do you do?", opts:["Delete the other names. Then click Send.", "Click Send. Everyone needs your answer.", "Click Forward and type Ms Tran's name."], why:"Only Ms Tran in the To box."},
    {tag:"Problem", show:"You forgot your password.", q:"What do you do?", opts:["Ask your teacher for help.", "Ask a friend for their password.", "Try ten new passwords quickly."], why:"Ask your teacher. Never use a friend's password."},
    {tag:"Problem", show:"You want to check that your email went.", q:"Where do you look?", opts:["Sent Items", "Junk Email", "Deleted Items"], why:"Sent Items keeps the emails you sent."},
    {tag:"Problem", show:"An email from a company you don't know is in Junk Email.", q:"What do you do?", opts:["Don't open it. Don't click the links.", "Open it and click all the links.", "Forward it to all your classmates."], why:"Junk emails are often not safe."},
    {tag:"Problem", show:"Ms Tran's address: tran_k   You typed: tran-k", q:"What is wrong?", opts:["You typed a dash, not an underscore.", "You typed a dot, not an underscore.", "You forgot the @ in the address."], why:"- is dash. _ is underscore."},
    {tag:"Problem", show:"You can't make the @.", q:"What do you do?", opts:["Hold down Shift and press 2.", "Press Caps Lock and type at.", "Type (at) with two brackets."], why:"Shift and 2 = @."}]},
  {id:"Q", grp:1, title:"The whole job", desc:"Steps, short replies and the practice run.", type:"q", shuffleQ:true, items:[
    {tag:"Steps", q:"What do you do first?", opts:["Sign in to your student email.", "Click Send at the top of the screen.", "Type a short subject for your email."], why:"First, sign in."},
    {tag:"Steps", q:"You clicked New mail. What do you do next?", opts:["Type your teacher's address in the To box.", "Open Sent Items and check your email.", "Sign out and close the browser."], why:"Then the address in the To box."},
    {tag:"Steps", q:"What do you do before you click Send?", opts:["Check the email carefully.", "Sign out of your email.", "Open Deleted Items."], why:"Check it, then send it."},
    {tag:"Steps", q:"You clicked Send. What do you do now?", opts:["Open Sent Items. Check it is there.", "Click Discard. Then sign out.", "Write the same email again."], why:"Check Sent Items."},
    {tag:"Steps", q:"Which order is right for the last steps?", opts:["Click Send, check Sent Items, then sign out.", "Sign out, click Send, then check Sent Items.", "Check Sent Items, sign out, then click Send."], why:"Send, check, sign out. Then close the browser."},
